<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qutie ticker</title>
<style>
  :root { --bg:#111; --fg:#eee; --dim:#888; --ok:#2e9d5b; --bad:#d64545; --meh:#777; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:18px/1.3 system-ui, sans-serif;
         height:100vh; display:flex; flex-direction:column; user-select:none; }
  header { display:flex; gap:.5rem; padding:.5rem; border-bottom:1px solid #333; }
  header input { flex:1; font:inherit; padding:.5rem; background:#222; color:var(--fg); border:1px solid #444; border-radius:6px; }
  button { font:inherit; padding:.5rem 1rem; border:0; border-radius:6px; background:#333; color:var(--fg); }
  button:active { background:#555; }
  ul { list-style:none; margin:0; padding:0; overflow-y:auto; flex:1; }
  li { display:flex; align-items:center; gap:.75rem; padding:.6rem .75rem; border-bottom:1px solid #222; }
  li:active { background:#222; }
  .dot { width:1rem; height:1rem; border-radius:50%; flex:none; background:var(--meh); }
  .success .dot { background:var(--ok); } .failure .dot, .timed_out .dot { background:var(--bad); }
  .main { flex:1; min-width:0; } .main div:last-child { color:var(--dim); font-size:.85em; }
  .empty { color:var(--dim); padding:2rem; text-align:center; }
  #toast { position:fixed; bottom:1rem; left:50%; transform:translateX(-50%); background:#333; padding:.5rem 1rem; border-radius:6px; display:none; }
</style>
</head>
<body>
<header>
  <input id="text" placeholder="Print a label… (use | for two lines)" maxlength="80">
  <button id="print">Print</button>
</header>
<ul id="runs"><li class="empty">Waiting for builds…</li></ul>
<div id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
function toast(msg) { const t = $("toast"); t.textContent = msg; t.style.display = "block"; setTimeout(() => t.style.display = "none", 2000); }
async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j;
}
function ago(iso) { const m = Math.round((Date.now() - Date.parse(iso)) / 60000); return m < 60 ? m + "m ago" : Math.round(m / 60) + "h ago"; }
async function refresh() {
  try {
    const runs = await (await fetch("/api/runs")).json();
    if (!runs.length) return;
    $("runs").replaceChildren(...runs.map((r) => {
      const li = document.createElement("li");
      li.className = r.conclusion || "";
      li.innerHTML = `<span class="dot"></span><div class="main"><div></div><div></div></div>`;
      const [a, b] = li.querySelectorAll(".main div");
      a.textContent = `${r.repository.name} #${r.run_number} · ${r.name ?? ""}`;
      b.textContent = `${r.head_branch ?? ""} · ${r.conclusion} · ${ago(r.updated_at)} · tap to reprint`;
      li.onclick = () => post("/api/reprint", { id: r.id }).then(() => toast("Reprinted"), (e) => toast(e.message));
      return li;
    }));
  } catch { /* server restarting */ }
}
$("print").onclick = () => {
  const lines = $("text").value.split("|").map((s) => s.trim()).filter(Boolean);
  if (!lines.length) return;
  post("/api/print", { lines }).then(() => { toast("Printed"); $("text").value = ""; }, (e) => toast(e.message));
};
refresh(); setInterval(refresh, 10000);
</script>
</body>
</html>
